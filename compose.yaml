services:
  app:
    image: ${LEDGER_IMAGE:-ghcr.io/iami315/financial:latest}
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: ${PORT:-7001}
      DATABASE_URL: /data/ledger.db
      BACKUP_DIR: /data/backups
    volumes:
      - ./data:/data
    ports:
      - '${PORT:-7001}:${PORT:-7001}/tcp'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "const p=process.env.PORT||'7001';fetch('http://127.0.0.1:'+p+'/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
